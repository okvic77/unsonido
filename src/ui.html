<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unsonido</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --text: #1c1c1a; --muted: #6b6b66; --line: #e3e3de;
    --accent: #2f6fed; --ok: #1f9d55; --warn: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1e1e1c; --text: #ececea; --muted: #9a9a94; --line: #2e2e2b;
      --accent: #6d9bff; --ok: #4ade80; --warn: #fb923c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 14px; }
  h1 { font-size: 20px; margin: 4px 0 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 200px; min-width: 0; }
  textarea { resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  input[type=text], input[type=password], select, textarea {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .muted { color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--line); margin-right: 6px; }
  .dot.on { background: var(--ok); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 6px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }
  li.speaker { flex-wrap: wrap; align-items: center; padding: 10px 0; }
  .speaker-info { flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
  .speaker-controls { flex: 1 1 260px; flex-wrap: nowrap; }
  .speaker-controls .vol { flex: 1; min-width: 60px; }
  button:disabled { opacity: .45; cursor: default; }
  li:first-child { border-top: 0; }
  .tag { font-size: 12px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .tag.critical { color: var(--warn); border-color: var(--warn); }
  #error { color: var(--warn); min-height: 1em; }
</style>
</head>
<body>
<main>
  <div class="row"><h1 class="grow">unsonido</h1><span id="error"></span></div>

  <section>
    <h2>Output</h2>
    <div class="row">
      <span class="muted">Volume</span>
      <input id="volume" type="range" min="0" max="1" step="0.01" class="grow">
      <span id="volume-label" class="muted"></span>
    </div>
  </section>

  <section>
    <h2>AirPlay</h2>
    <ul id="airplay"></ul>
  </section>

  <section>
    <h2>Background</h2>
    <p id="bg-status" class="muted" style="margin:0 0 10px"></p>
    <textarea id="bg-url" rows="3" placeholder="https://… Icecast / radio stream URL&#10;https://… fallback, used if the first one fails&#10;…one URL per line"></textarea>
    <div class="row" style="margin-top:8px">
      <span class="muted grow">One URL per line; the ones after the first are fallbacks.</span>
      <button class="primary" id="bg-play">Play</button>
      <button id="bg-stop">Stop</button>
    </div>
  </section>

  <section>
    <h2>Send alert</h2>
    <div class="row">
      <input id="alert-text" type="text" class="grow" placeholder="Text to speak">
      <select id="alert-priority" style="width:auto"><option>notification</option><option>critical</option></select>
      <select id="alert-provider" style="width:auto"></select>
      <button class="primary" id="alert-send">Send</button>
    </div>
  </section>

  <section>
    <div class="row"><h2 class="grow">Alerts</h2>
      <button id="skip">Skip current</button><button id="clear">Clear queue</button></div>
    <ul id="alerts"></ul>
  </section>

  <section>
    <h2>Access token</h2>
    <div class="row">
      <input id="token" type="password" class="grow" placeholder="Only needed if server.token is set">
      <button id="token-save">Save</button>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let token = "";
try { token = localStorage.getItem("unsonido-token") || ""; } catch {}
$("token").value = token;

async function api(method, path, body) {
  const headers = { "content-type": "application/json" };
  if (token) headers.authorization = "Bearer " + token;
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return data;
}
function show(err) { $("error").textContent = err ? err.message || String(err) : ""; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

let draggingVolume = false;
$("volume").addEventListener("input", () => { draggingVolume = true; $("volume-label").textContent = Math.round($("volume").value * 100) + "%"; });
$("volume").addEventListener("change", async () => {
  try { await api("PUT", "/volume", { volume: Number($("volume").value) }); show(); } catch (e) { show(e); }
  draggingVolume = false;
});
$("bg-play").onclick = async () => {
  const urls = $("bg-url").value.split("\n").map(u => u.trim()).filter(Boolean);
  try { await api("PUT", "/background", { urls }); show(); refresh(); } catch (e) { show(e); }
};
$("bg-stop").onclick = async () => { try { await api("DELETE", "/background"); show(); refresh(); } catch (e) { show(e); } };
$("alert-send").onclick = async () => {
  const body = { text: $("alert-text").value, priority: $("alert-priority").value };
  if ($("alert-provider").value) body.provider = $("alert-provider").value;
  try { const r = await api("POST", "/alerts", body); show(r.status === "suppressed" ? new Error("suppressed: " + r.reason) : null); $("alert-text").value = ""; refresh(); }
  catch (e) { show(e); }
};
$("skip").onclick = () => api("DELETE", "/alerts/current").then(refresh, show);
$("clear").onclick = () => api("DELETE", "/alerts").then(refresh, show);
$("token-save").onclick = () => { token = $("token").value; try { localStorage.setItem("unsonido-token", token); } catch {} loadProviders(); refresh(); };

async function loadProviders() {
  try {
    const providers = await api("GET", "/tts/providers");
    $("alert-provider").innerHTML = providers.map(p =>
      `<option value="${esc(p.name)}"${p.default ? " selected" : ""}>${esc(p.name)} (${esc(p.kind)})</option>`).join("");
  } catch (e) { show(e); }
}

const track = (np) => np ? [np.title, np.artist].filter(Boolean).map(esc).join(" — ") : "";
const airplayDragging = new Set();

// Rows are keyed by speaker name and updated in place, so a slider being dragged is not reset.
function renderAirplay(list) {
  const ul = $("airplay");
  const names = new Set(list.map(r => r.name));
  for (const li of [...ul.children]) if (!names.has(li.dataset.name)) li.remove();
  for (const r of list) {
    let li = [...ul.children].find(el => el.dataset.name === r.name);
    if (!li) {
      li = document.createElement("li");
      li.dataset.name = r.name;
      li.className = "speaker";
      li.innerHTML = `
        <div class="speaker-info">
          <div><span class="dot"></span><b class="name"></b> <span class="muted client"></span></div>
          <div class="track"></div>
        </div>
        <div class="row speaker-controls">
          <button class="mute" title="Mute this speaker">Mute</button>
          <input class="vol" type="range" min="0" max="1" step="0.01" aria-label="Speaker volume" title="Volume, kept in sync with the sending device">
          <button class="disconnect" title="Disconnect the sender">Disconnect</button>
        </div>`;
      const path = "/airplay/" + encodeURIComponent(r.name);
      const vol = li.querySelector(".vol");
      vol.addEventListener("input", () => airplayDragging.add(r.name));
      vol.addEventListener("change", async () => {
        try { await api("PUT", path, { volume: Number(vol.value) }); show(); } catch (e) { show(e); }
        airplayDragging.delete(r.name);
      });
      li.querySelector(".mute").onclick = () =>
        api("PUT", path, { muted: li.dataset.muted !== "true" }).then(refresh, show);
      li.querySelector(".disconnect").onclick = () =>
        api("DELETE", path + "/session").then(refresh, show);
      ul.appendChild(li);
    }
    li.dataset.muted = r.muted;
    li.querySelector(".dot").className = "dot" + (r.playing ? " on" : "");
    li.querySelector(".name").textContent = r.name;
    li.querySelector(".client").textContent = r.client ? "· " + r.client : "· available";
    const t = track(r.now_playing);
    li.querySelector(".track").innerHTML =
      (t ? "♪ " + t : "") + (r.paused_for_alert ? ` <span class="tag critical">paused for alert</span>` : "") +
      (r.client && r.volume_synced === false ? ` <span class="tag" title="The device did not accept the volume change; it applies here only">volume not synced to device</span>` : "");
    const mute = li.querySelector(".mute");
    mute.textContent = r.muted ? "Unmute" : "Mute";
    mute.classList.toggle("primary", r.muted);
    if (!airplayDragging.has(r.name)) li.querySelector(".vol").value = r.volume;
    li.querySelector(".disconnect").disabled = !r.client;
  }
}

async function refresh() {
  let s;
  try { s = await api("GET", "/status"); show(); } catch (e) { show(e); return; }
  if (!draggingVolume) { $("volume").value = s.volume; $("volume-label").textContent = Math.round(s.volume * 100) + "%"; }

  renderAirplay(s.airplay);

  const bg = s.background;
  const bgUrls = bg ? [bg.url, ...(bg.urls || [])].filter(Boolean) : [];
  const which = bg && bg.current_url && bgUrls.length > 1
    ? ` (${bgUrls.indexOf(bg.current_url) === 0 ? "primary" : "fallback " + bgUrls.indexOf(bg.current_url)})` : "";
  $("bg-status").innerHTML = bg
    ? `<span class="dot ${bg.playing ? "on" : ""}"></span>${esc(bg.current_url || bg.url || bg.file)}${which} · ${esc(bg.state)}${bg.title ? " · <b>" + esc(bg.title) + "</b>" : ""}`
    : "Nothing playing";
  if (bgUrls.length && document.activeElement !== $("bg-url") && !$("bg-url").value) $("bg-url").value = bgUrls.join("\n");

  const items = [];
  if (s.current) items.push(`<li><span>▶ ${esc(s.current.label)}</span><span class="tag ${s.current.priority}">${s.current.priority}</span></li>`);
  for (const a of s.queue) items.push(`<li><span class="muted">queued · ${esc(a.label)}</span><span class="tag ${a.priority}">${a.priority}</span></li>`);
  for (const h of s.history.slice(0, 8)) items.push(`<li><span class="muted">${new Date(h.at).toLocaleTimeString()} · ${esc(h.label)}</span><span class="tag">${h.result}</span></li>`);
  $("alerts").innerHTML = items.join("") || `<li class="muted">No alerts yet</li>`;
}

loadProviders();
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
