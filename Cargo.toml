[package]
name = "unsonido"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
futures-util = "0.3.34"
hex = "0.4.3"
hound = "3.5.1"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
rsa = "0.9.10"
rtrb = "0.4.1"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.11.1"
socket2 = "0.6.5"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "aiff", "alac"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
